<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoneyFlow | Perfil</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body data-theme="dark">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand"><div class="brand-badge">MF</div><div class="brand-text">MoneyFlow</div></div>
        <nav class="sidebar-nav"><a href="dashboard.html" class="nav-link"><span class="icon">📊</span>Dashboard</a></nav>
        <div class="sidebar-footer">
          <div class="user-mini"><div class="avatar" data-user-initials>U</div><div><strong data-user-name>Usuário</strong><small>Conta ativa</small></div></div>
          <button class="secondary-btn" data-action="logout" style="width:100%;">Sair</button>
        </div>
      </aside>
      <main class="main-panel">
        <div class="topbar"><h1 class="page-title">Personalização do perfil</h1><div class="topbar-actions"><button class="theme-toggle" data-theme-toggle aria-label="Alternar tema">☀️</button></div></div>
        <div class="page-header-card"><div><h2>Cor de destaque</h2><div class="summary-mini">A preferência é salva somente para esta conta.</div></div></div>
        <section class="content-card profile-settings">
          <div class="profile-preview" id="profilePreview">
            <div class="avatar" data-user-initials>U</div>
            <div><strong data-user-name>Usuário</strong><div class="inline-note">Prévia da identificação do perfil</div></div>
          </div>
          <form id="profileForm">
            <div class="form-group">
              <label>Opções de cor</label>
              <div class="profile-color-options" id="profileColorOptions">
                <button type="button" class="profile-color-option" data-accent="#38bdf8" style="background:#38bdf8" aria-label="Azul-ciano" aria-pressed="false"></button>
                <button type="button" class="profile-color-option" data-accent="#16c784" style="background:#16c784" aria-label="Verde" aria-pressed="false"></button>
                <button type="button" class="profile-color-option" data-accent="#f59e0b" style="background:#f59e0b" aria-label="Âmbar" aria-pressed="false"></button>
                <button type="button" class="profile-color-option" data-accent="#ff5f6d" style="background:#ff5f6d" aria-label="Vermelho" aria-pressed="false"></button>
                <button type="button" class="profile-color-option" data-accent="#a78bfa" style="background:#a78bfa" aria-label="Violeta" aria-pressed="false"></button>
                <button type="button" class="profile-color-option" data-accent="#ec4899" style="background:#ec4899" aria-label="Rosa" aria-pressed="false"></button>
              </div>
            </div>
            <div class="form-group" style="margin-top:18px;max-width:260px;">
              <label for="profileAccent">Cor personalizada</label>
              <input id="profileAccent" type="color" value="#38bdf8" />
            </div>
            <div class="form-actions">
              <button type="submit" class="primary-btn">Salvar cor</button>
              <button type="button" class="secondary-btn" id="resetProfileAccent">Restaurar padrão</button>
            </div>
          </form>
        </section>
      </main>
    </div>
    <div id="toastContainer" class="toast-container" aria-live="polite"></div>
    <script src="../js/storage.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/profile.js"></script>
  </body>
</html>
