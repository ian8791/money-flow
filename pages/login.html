<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoneyFlow | Login</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/auth.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body class="auth-body" data-theme="dark">
    <div class="auth-shell">
      <div class="auth-branding">
        <div class="brand-mark">MF</div>
        <h1>MoneyFlow</h1>
        <p>Controle seus ganhos, despesas e objetivos financeiros em um único painel moderno e inteligente.</p>

        <div class="auth-stat-list">
          <div class="auth-stat">
            <div class="stat-icon">💰</div>
            <div>
              <strong>+R$ 1.000</strong>
              <span>Receitas mensais</span>
            </div>
          </div>
          <div class="auth-stat">
            <div class="stat-icon">📉</div>
            <div>
              <strong>-R$ 450</strong>
              <span>Despesas mensais</span>
            </div>
          </div>
          <div class="auth-stat">
            <div class="stat-icon">📈</div>
            <div>
              <strong>+R$ 550</strong>
              <span>Saldo disponível</span>
            </div>
          </div>
        </div>
      </div>

      <div class="auth-form-panel">
        <div class="auth-card">
          <div class="auth-header">
            <h2>Entrar</h2>
            <p>Use sua conta para continuar.</p>
          </div>

          <form id="loginForm" class="auth-form" novalidate>
            <div class="form-group">
              <label for="loginEmail">E-mail</label>
              <input id="loginEmail" type="email" placeholder="seuemail@exemplo.com" required />
            </div>

            <div class="form-group">
              <label for="loginPassword">Senha</label>
              <input id="loginPassword" type="password" placeholder="••••••••" required />
            </div>

            <div class="auth-actions">
              <button type="submit" class="primary-btn">Entrar</button>
              <p class="auth-link">Ainda não possui conta? <a href="cadastro.html">Cadastre-se</a></p>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <script src="../js/storage.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>
